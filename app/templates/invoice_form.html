{% extends "base.html" %}
{% block title %}New invoice · {{ app_name }}{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">New invoice</h1>
<form method="post" class="max-w-3xl space-y-6 bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
  <div class="grid md:grid-cols-2 gap-4">
    <div>
      <label class="text-xs font-medium text-slate-600">Project</label>
      <select name="project_id" required class="mt-1 w-full border rounded-lg px-3 py-2 text-sm">
        {% for p in projects %}
        <option value="{{ p.id }}" {% if project_id and p.id == project_id %}selected{% endif %}>{{ p.code }} — {{ p.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="text-xs font-medium text-slate-600">Linked sales order</label>
      <select name="sales_order_id" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm">
        {% for s in sales_orders %}
        <option value="{{ s.id }}">{{ s.number }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="text-xs font-medium text-slate-600">Basis</label>
      <select name="basis" id="basis" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm">
        <option value="line_items">Line items</option>
        <option value="percent">Percentage of SO</option>
      </select>
    </div>
    <div>
      <label class="text-xs font-medium text-slate-600">Tax %</label>
      <input name="tax_percent" type="number" step="0.01" value="0" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm"/>
    </div>
    <div>
      <label class="text-xs font-medium text-slate-600">Issue date</label>
      <input name="issue_date" type="date" required class="mt-1 w-full border rounded-lg px-3 py-2 text-sm"/>
    </div>
    <div>
      <label class="text-xs font-medium text-slate-600">Due date</label>
      <input name="due_date" type="date" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm"/>
    </div>
    <div id="pct-wrap" class="hidden md:col-span-2">
      <label class="text-xs font-medium text-slate-600">Percent of SO</label>
      <input name="percent_of_so" type="number" step="0.01" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm" placeholder="e.g. 30"/>
    </div>
  </div>
  <div id="lines-wrap">
    <p class="text-xs font-medium text-slate-600 mb-2">Line amounts</p>
    {% for i in range(8) %}
    <div class="grid grid-cols-12 gap-2 mb-2">
      <input name="desc_{{ i }}" placeholder="Description" class="col-span-8 border rounded px-2 py-1 text-xs"/>
      <input name="amt_{{ i }}" placeholder="Amount" type="number" step="0.01" class="col-span-4 border rounded px-2 py-1 text-xs"/>
    </div>
    {% endfor %}
  </div>
  <button type="submit" class="bg-brand-700 text-white text-sm font-medium px-4 py-2 rounded-lg">Create</button>
</form>
<script>
  const b = document.getElementById('basis');
  const pw = document.getElementById('pct-wrap');
  const lw = document.getElementById('lines-wrap');
  function t() {
    if (b.value === 'percent') { pw.classList.remove('hidden'); lw.classList.add('hidden'); }
    else { pw.classList.add('hidden'); lw.classList.remove('hidden'); }
  }
  b.addEventListener('change', t); t();
</script>
{% endblock %}
