{% extends "base.html" %}
{% block title %}New sales order · {{ app_name }}{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">New sales order</h1>
<form method="post" class="max-w-3xl space-y-6 bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
  <div class="grid md:grid-cols-2 gap-4">
    <div>
      <label class="text-xs font-medium text-slate-600">Project</label>
      <select name="project_id" required class="mt-1 w-full border rounded-lg px-3 py-2 text-sm">
        {% for p in projects %}
        <option value="{{ p.id }}" {% if project_id and p.id == project_id %}selected{% endif %}>{{ p.code }} — {{ p.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="text-xs font-medium text-slate-600">Link quotation (optional)</label>
      <select name="quotation_id" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm">
        <option value="">— None —</option>
        {% for q in quotations %}
        <option value="{{ q.id }}">{{ q.number }}{% if q.project %} — {{ q.project.code }}{% elif q.prospect_project_name %} — {{ q.prospect_project_name }}{% endif %}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="text-xs font-medium text-slate-600">Tax %</label>
      <input name="tax_percent" type="number" step="0.01" value="0" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm"/>
    </div>
  </div>
  <div>
    <p class="text-xs font-medium text-slate-600 mb-2">Line items</p>
    {% for i in range(8) %}
    <div class="grid grid-cols-12 gap-2 mb-2">
      <input name="desc_{{ i }}" placeholder="Description" class="col-span-6 border rounded px-2 py-1 text-xs"/>
      <input name="qty_{{ i }}" placeholder="Qty" type="number" step="0.0001" class="col-span-3 border rounded px-2 py-1 text-xs"/>
      <input name="price_{{ i }}" placeholder="Unit price" type="number" step="0.01" class="col-span-3 border rounded px-2 py-1 text-xs"/>
    </div>
    {% endfor %}
  </div>
  <button type="submit" class="bg-brand-700 text-white text-sm font-medium px-4 py-2 rounded-lg">Create</button>
</form>
{% endblock %}
