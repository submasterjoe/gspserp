{% extends "base.html" %}
{% block title %}New claim · {{ app_name }}{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">New internal claim</h1>
<form method="post" enctype="multipart/form-data" class="max-w-lg space-y-4 bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
  <div>
    <label class="text-xs font-medium text-slate-600">Project</label>
    <select name="project_id" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" required>
      {% for p in projects %}
      <option value="{{ p.id }}" {% if project_id and p.id == project_id %}selected{% endif %}>{{ p.code }} — {{ p.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label class="text-xs font-medium text-slate-600">Title</label>
    <input name="title" required class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm"/>
  </div>
  <div>
    <label class="text-xs font-medium text-slate-600">Category</label>
    <select name="category" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
      {% for c in categories %}
      <option value="{{ c }}">{{ c }}</option>
      {% endfor %}
    </select>
    <p class="text-xs text-slate-500 mt-1">Helps Finance review (mileage, fuel, hotel, etc.).</p>
  </div>
  <div>
    <label class="text-xs font-medium text-slate-600">Amount</label>
    <input name="amount" type="number" step="0.01" required class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm"/>
  </div>
  <div>
    <label class="text-xs font-medium text-slate-600">Receipt (optional)</label>
    <input name="receipt" type="file" accept=".png,.jpg,.jpeg,.webp,.pdf" class="mt-1 w-full text-sm"/>
    <p class="text-xs text-slate-500 mt-1">We auto-check clarity for images (blurry / too small).</p>
  </div>
  <div>
    <label class="text-xs font-medium text-slate-600">Description</label>
    <textarea name="description" rows="3" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm"></textarea>
  </div>
  <button type="submit" class="bg-brand-700 text-white text-sm font-medium px-4 py-2 rounded-lg">Save draft</button>
</form>
{% endblock %}
