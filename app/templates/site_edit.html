{% extends "base.html" %}
{% block title %}Edit site · {{ site.name }} · {{ app_name }}{% endblock %}
{% block content %}
<div class="mb-6">
  <a href="/sites/{{ site.id }}" class="text-sm text-brand-700 hover:underline">← Site</a>
  <h1 class="text-2xl font-bold text-slate-900 mt-2">Edit site</h1>
</div>

<form method="post" class="max-w-2xl space-y-4 bg-white border border-slate-200 rounded-xl p-6 shadow-sm text-sm">
  <div>
    <label class="text-xs font-medium text-slate-600">Project</label>
    <select name="project_id" required class="mt-1 w-full border rounded-lg px-3 py-2">
      {% for p in projects %}
      <option value="{{ p.id }}" {% if site.project_id == p.id %}selected{% endif %}>{{ p.code }} — {{ p.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label class="text-xs font-medium text-slate-600">Site name</label>
    <input name="name" required value="{{ site.name }}" class="mt-1 w-full border rounded-lg px-3 py-2"/>
  </div>
  <div>
    <label class="text-xs font-medium text-slate-600">Address</label>
    <textarea name="address" rows="2" class="mt-1 w-full border rounded-lg px-3 py-2">{{ site.address or '' }}</textarea>
  </div>
  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="text-xs font-medium text-slate-600">Latitude</label>
      <input name="lat" value="{% if site.lat %}{{ site.lat }}{% endif %}" class="mt-1 w-full border rounded-lg px-3 py-2 font-mono"/>
    </div>
    <div>
      <label class="text-xs font-medium text-slate-600">Longitude</label>
      <input name="lng" value="{% if site.lng %}{{ site.lng }}{% endif %}" class="mt-1 w-full border rounded-lg px-3 py-2 font-mono"/>
    </div>
  </div>
  <div>
    <label class="text-xs font-medium text-slate-600">Status</label>
    <select name="status" class="mt-1 w-full border rounded-lg px-3 py-2 font-mono">
      {% for s in statuses %}
      <option value="{{ s }}" {% if site.status.value == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label class="text-xs font-medium text-slate-600">Notes</label>
    <textarea name="notes" rows="2" class="mt-1 w-full border rounded-lg px-3 py-2">{{ site.notes or '' }}</textarea>
  </div>
  <div class="flex items-center gap-2">
    <button type="submit" class="bg-brand-700 text-white font-medium px-4 py-2 rounded-lg">Save</button>
    <a href="/sites/{{ site.id }}" class="text-sm text-slate-600 hover:underline">Cancel</a>
  </div>
</form>
{% endblock %}
