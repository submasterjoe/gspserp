<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GSPS SERP Pro</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="toastHost" class="gsps-toast-host" aria-live="polite"></div>
  <div id="loadingOverlay" class="gsps-loading-overlay" style="display: none" aria-hidden="true">
    <div class="gsps-spinner" role="status" aria-label="Loading"></div>
  </div>

  <div class="popup-wrap">
    <section class="profile-card" aria-label="Profile">
      <div class="profile-row">
        <div class="avatar-ring" id="avatarRing">
          <div class="avatar-inner" id="avatarInner">
            <span id="avatarInitials">JD</span>
          </div>
        </div>
        <div class="profile-meta">
          <p class="welcome" id="welcomeLine">Good morning, SERP Professional</p>
          <p class="streak" id="streakLine" aria-label="Streak">🔥 0 day streak</p>
        </div>
        <button type="button" class="usage-col usage-col--btn" id="btnUsageRing" aria-label="Open usage analytics in options">
          <svg class="ring-svg" viewBox="0 0 44 44" aria-hidden="true">
            <circle class="ring-bg" cx="22" cy="22" r="18" />
            <circle class="ring-fg" id="usageRingFg" cx="22" cy="22" r="18" />
          </svg>
          <span class="ring-label" id="usageRingLabel">0/50</span>
        </button>
        <button type="button" class="btn-icon-pencil" id="btnEditProfile" title="Edit profile" aria-label="Edit profile">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
      </div>
    </section>

    <section class="suggest-row" id="suggestRow" aria-label="Keyword suggestions" style="display: none;">
      <span class="suggest-label">Suggestions</span>
      <div class="suggest-chips" id="suggestChips"></div>
    </section>

    <section class="actions">
      <button type="button" class="btn-pri" id="btnAnalyzeSerp" aria-label="Analyze SERP for active tab">
        🔍 Analyze SERP
      </button>
      <button type="button" class="btn-sec" id="btnGenerateContent" aria-label="Generate content">
        ✨ Generate Content
      </button>
    </section>

    <section class="recent-card">
      <div class="recent-head">
        <span class="recent-title">Recent activity</span>
        <button type="button" class="btn-clear" id="btnClearHistory" aria-label="Clear recent activity">Clear</button>
      </div>
      <div id="recentSkeleton" class="skeleton-block" style="display: none; height: 72px;"></div>
      <ul class="recent-list" id="recentList" role="list"></ul>
      <p class="recent-empty" id="recentEmpty">No searches yet.</p>
    </section>
  </div>

  <footer class="popup-footer">
    <span class="footer-brand" id="footerBrand">GSPS SERP Pro · v…</span>
    <button type="button" class="btn-theme-corner" id="btnThemeToggle" title="Toggle theme" aria-label="Toggle theme">🌙</button>
  </footer>

  <script src="js/state-manager.js"></script>
  <script src="js/offline-queue.js"></script>
  <script src="js/api-core.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/error-handler.js"></script>
  <script src="js/profile-manager.js"></script>
  <script src="js/usage-tracker.js"></script>
  <script src="js/history-manager.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/export-import.js"></script>
  <script src="js/shortcuts.js"></script>
  <script src="storage.js"></script>
  <script src="js/serp-hooks.js"></script>
  <script src="popup.js"></script>
</body>
</html>
